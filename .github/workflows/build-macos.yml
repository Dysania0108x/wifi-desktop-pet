name: Build macOS app
on:
  workflow_dispatch:
  push:
    branches: [feat/mac-desktop-mvp]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - name: Package app without publishing
        run: npm run build -- --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Sign test app and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="release/mac-arm64/WiFi Desktop Pet.app"
          test -d "$APP/Contents/Resources"
          ASAR="$APP/Contents/Resources/app.asar"
          test -f "$ASAR"
          npx --no-install asar list "$ASAR" > asar-files.txt
          for entry in /dist/index.html /dist/sprites/wifi-v3/stand.png /dist/sprites/wifi-v3/sniff-2.png /electron/main.cjs; do
            grep -Fx "$entry" asar-files.txt
          done
          # Sign the nested Electron components, then the containing bundle.
          find "$APP/Contents/Frameworks" -type d -name '*.app' -prune -print0 | while IFS= read -r -d '' nested; do
            codesign --force --deep --sign - "$nested"
          done
          find "$APP/Contents/Frameworks" -type d -name '*.framework' -prune -print0 | while IFS= read -r -d '' nested; do
            codesign --force --deep --sign - "$nested"
          done
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1
      - name: Archive verified app with macOS metadata
        run: |
          ditto -c -k --sequesterRsrc --keepParent "release/mac-arm64/WiFi Desktop Pet.app" "release/WiFi-Desktop-Pet-mac-arm64-verified.zip"
          ditto -x -k "release/WiFi-Desktop-Pet-mac-arm64-verified.zip" "release/verify-extracted"
          codesign --verify --deep --strict --verbose=2 "release/verify-extracted/WiFi Desktop Pet.app"
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-desktop-pet-macos-verified
          path: release/WiFi-Desktop-Pet-mac-arm64-verified.zip
          if-no-files-found: error
