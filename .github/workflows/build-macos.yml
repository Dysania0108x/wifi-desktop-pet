name: Build macOS app
on:
  workflow_dispatch:
  push:
    branches: [feat/mac-desktop-mvp]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Package app without publishing
        run: npm run build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Sign test app and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/mac-arm64/WiFi Desktop Pet.app"
          test -d "$APP/Contents/Resources"
          test -f "$APP/Contents/Resources/app.asar"
          # Sign the nested Electron components, then the containing bundle.
          find "$APP/Contents/Frameworks" -type d -name '*.app' -prune -print0 | while IFS= read -r -d '' nested; do
            codesign --force --deep --sign - "$nested"
          done
          find "$APP/Contents/Frameworks" -type d -name '*.framework' -prune -print0 | while IFS= read -r -d '' nested; do
            codesign --force --deep --sign - "$nested"
          done
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1
      - name: Archive verified app with macOS metadata
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/mac-arm64/WiFi Desktop Pet.app" "dist/WiFi-Desktop-Pet-mac-arm64-verified.zip"
          ditto -x -k "dist/WiFi-Desktop-Pet-mac-arm64-verified.zip" "dist/verify-extracted"
          codesign --verify --deep --strict --verbose=2 "dist/verify-extracted/WiFi Desktop Pet.app"
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-desktop-pet-macos-verified
          path: dist/WiFi-Desktop-Pet-mac-arm64-verified.zip
          if-no-files-found: error
